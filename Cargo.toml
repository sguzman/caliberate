[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/db",
    "crates/library",
    "crates/assets",
    "crates/conversion",
    "crates/server",
    "crates/device",
    "crates/plugins",
    "crates/gui",
    "crates/jobs",
    "crates/metadata",
    "crates/formats",
    "crates/zpaq",
]
resolver = "2"

# Installable root package. `cargo install --path .` builds only the daemon;
# the existing workspace application binaries remain in crates/app.
[package]
name = "caliberate-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "caliberate-daemon"
path = "src/bin/caliberate-daemon.rs"

[dependencies]
caliberate-core = { path = "crates/core" }
caliberate-server = { path = "crates/server" }
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
